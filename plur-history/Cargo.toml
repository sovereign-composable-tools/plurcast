[package]
name = "plur-history"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "plur-history"
path = "src/main.rs"

[features]
default = ["ssb"]
# Secure Scuttlebutt support (experimental), see #40
ssb = ["libplurcast/ssb"]

[dependencies]
libplurcast = { path = "../libplurcast", default-features = false }

# CLI
clap = { workspace = true }

# Database
sqlx = { workspace = true }

# Async runtime
tokio = { workspace = true }

# Serialization
serde = { workspace = true }
serde_json = { workspace = true }

# Utilities
chrono = { workspace = true }
anyhow = { workspace = true }
shellexpand = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
uuid = { workspace = true }
