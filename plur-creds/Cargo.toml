[package]
name = "plur-creds"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "plur-creds"
path = "src/main.rs"

[features]
default = ["ssb"]
# Secure Scuttlebutt support (experimental), see #40
ssb = ["libplurcast/ssb"]

[dependencies]
libplurcast = { path = "../libplurcast", default-features = false }

# CLI
clap = { workspace = true }

# Async runtime
tokio = { workspace = true }

# Error handling
anyhow = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

# Password prompts
rpassword = { workspace = true }

# TTY detection

# Utilities
dirs = { workspace = true }

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.0"
tempfile = "3.8"
