[package]
name = "plur-post"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "plur-post"
path = "src/main.rs"

[features]
default = ["ssb"]
# Secure Scuttlebutt support (experimental), see #40
ssb = ["libplurcast/ssb"]

[dependencies]
# Internal library
libplurcast = { path = "../libplurcast", default-features = false }

# CLI
clap = { workspace = true }

# Async runtime
tokio = { workspace = true }

# Serialization
serde_json = { workspace = true }

# Utilities
chrono = { workspace = true }
uuid = "1.11"

# Error handling

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
assert_cmd = "2.0"
predicates = "3.1"
tempfile = { workspace = true }
nostr-sdk = { workspace = true }
serde_json = { workspace = true }
sqlx = { workspace = true }
tokio = { workspace = true }
