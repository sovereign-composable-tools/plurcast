[package]
name = "plur-setup"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "plur-setup"
path = "src/main.rs"

[features]
default = ["ssb"]
# Secure Scuttlebutt support (experimental), see #40
ssb = ["libplurcast/ssb", "dep:kuska-ssb"]

[dependencies]
libplurcast = { path = "../libplurcast", default-features = false }

# Platform clients (for key generation)
nostr-sdk = { workspace = true }
kuska-ssb = { workspace = true, optional = true }

# CLI
clap = { workspace = true }

# Async runtime
tokio = { workspace = true }

# Utilities
anyhow = { workspace = true }
rpassword = { workspace = true }
serde_json = { workspace = true }
shellexpand = { workspace = true }
dirs = { workspace = true }

# Logging
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
